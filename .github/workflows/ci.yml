name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# B1（Docker 构建链损坏）之所以长期没被发现，根因就是没人跑过 docker build。
# 这里把三条最容易被跳过、又最致命的流水线固化下来：后端测试、前端构建、镜像构建。
jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    env:
      # CI 里没有 .env，凭据会落回默认值。settings 在非 DEBUG 下会拒绝默认凭据启动
      # （H3 安全门禁），这里不是生产环境，显式放行以让测试正常跑起来。
      ALLOW_DEFAULT_CREDENTIALS: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # 测试依赖独立成 requirements-dev.txt：生产镜像只装运行时依赖
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 测试库走 --keepdb 之外的路径：这里始终从零建库，避免本地残留掩盖迁移问题
      - run: python manage.py migrate
      - run: python -m pytest tests -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 必须真的产出 out/：静态导出失败 = all-in-one 镜像里没有前端
      - run: npm run build
      - name: 校验静态导出产物
        run: |
          test -f out/index.html || { echo "缺少 out/index.html"; exit 1; }
          test -f out/dashboard/index.html || { echo "缺少 out/dashboard/index.html"; exit 1; }

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nvidia2api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
